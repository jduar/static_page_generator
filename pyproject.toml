[project]
name = "static-page-generator"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "exif==1.6.0",
    "IPTCInfo3==2.1.4",
    "Jinja2==3.1.2",
    "Markdown==3.4.3",
    "MarkupSafe==2.1.2",
    "Pillow==12.3.0",
    "yoga==1.3.4",
]

[dependency-groups]
dev = [
    "watchfiles==1.2.0",
    "ruff==0.15.20",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 120

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.lint]
# pycodestyle (`E`), Pyflakes (`F`), flake8-bugbear, isort
select = ["E", "F", "B", "I", "PL", "S", "ANN", "W"]

ignore = ["ANN204", "ANN101"]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
skip-magic-trailing-comma = true
