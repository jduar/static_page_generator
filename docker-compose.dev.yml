services:
  generator:
    build:
      context: .
      args:
        UV_SYNC_FLAGS: ""
    image: page-generator-dev
    container_name: page-generator-dev
    command: watchfiles "python src/main.py" src data/pages config.toml
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ./config.toml:/app/config.toml:ro
      - ./src:/app/src
      - ./example_content:/app/example_content

  nginx:
    image: nginx:stable-alpine
    container_name: page-generator-nginx
    restart: unless-stopped
    depends_on:
      - generator
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/usr/share/nginx/html:ro
      - ./data:/usr/share/nginx/data:ro
    ports:
      - "8080:80"
